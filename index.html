<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo 2048">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- page -->
<title>Photo 2048</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #faf8f5;
  --fg: #2b2a28;
  --muted: #77736d;
  --board: #bbada0;
  --cell: #cdc1b4;
  --slot: #eee7de;
  --photo-bg: #ffffff;
  --veil: rgba(250, 248, 245, 0.8);
  --btn: #2b2a28;
  --btn-fg: #ffffff;
  --gap: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1b1a; --fg: #eeeae4; --muted: #a29d96; --board: #4a443e; --cell: #5c554e;
    --slot: #2c2a28; --photo-bg: #111110; --veil: rgba(28, 27, 26, 0.8); --btn: #eeeae4; --btn-fg: #1c1b1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1b1a; --fg: #eeeae4; --muted: #a29d96; --board: #4a443e; --cell: #5c554e;
  --slot: #2c2a28; --photo-bg: #111110; --veil: rgba(28, 27, 26, 0.8); --btn: #eeeae4; --btn-fg: #1c1b1a;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { touch-action: manipulation; }
:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 460px;
  margin: 0 auto;
  padding-block: 16px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

header { display: flex; align-items: center; gap: 12px; }
h1 { margin: 0 auto 0 0; font-size: 26px; font-weight: 800; white-space: nowrap; }
.score { font-size: 15px; color: var(--muted); white-space: nowrap; }
.score b { color: var(--fg); font-variant-numeric: tabular-nums; }
button {
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  height: 40px;
  padding: 0 14px;
  border: 0;
  border-radius: 8px;
  background: var(--btn);
  color: var(--btn-fg);
  cursor: pointer;
  white-space: nowrap;
}
button:focus-visible { outline: 3px solid var(--muted); outline-offset: 2px; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.board {
  position: relative;
  width: 100%;
  width: min(100%, max(260px, calc(100dvh - 200px)));
  aspect-ratio: 1;
  margin-inline: auto;
  background: var(--board);
  border-radius: 10px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.cells {
  position: absolute; inset: 0;
  padding: var(--gap);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
}
.cells span { background: var(--cell); border-radius: 6px; }
.tile {
  position: absolute;
  z-index: 1;
  left: var(--gap); top: var(--gap);
  width: calc((100% - 5 * var(--gap)) / 4);
  height: calc((100% - 5 * var(--gap)) / 4);
  transform: translate(calc(var(--c) * (100% + var(--gap))), calc(var(--r) * (100% + var(--gap))));
  transition: transform 100ms ease-out;
}
.tile.gone { z-index: 0; }
.tile-face {
  width: 100%; height: 100%;
  display: grid; place-items: center;
  border-radius: 6px;
  background: var(--tile-bg) center / contain no-repeat;
  color: var(--tile-fg);
  font-weight: 800;
  font-size: clamp(16px, 6vw, 30px);
}
.tile.new .tile-face { animation: grow 150ms 80ms ease-out both; }
@keyframes grow { from { transform: scale(0); } }

.message {
  position: absolute; inset: 0;
  z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: var(--veil);
  border-radius: 10px;
  font-size: 28px;
  font-weight: 800;
}

.photos-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.photos h2 { margin: 0; font-size: 18px; }
button.link {
  height: auto;
  padding: 6px 0;
  background: none;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.photos p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.slots {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin-bottom: 12px;
}
.slot {
  height: auto;
  aspect-ratio: 1;
  padding: 0;
  border-radius: 6px;
  background: var(--slot) center / contain no-repeat;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}
.slot.has-photo { color: transparent; background-color: var(--photo-bg); }

@media (prefers-reduced-motion: reduce) {
  .tile { transition: none; }
  .tile.new .tile-face { animation: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Photo 2048</h1>
    <span class="score">Score <b id="score">0</b></span>
    <button type="button" id="new-game">New game</button>
  </header>

  <div class="board" id="board" tabindex="0" aria-label="Game board. Swipe or use the arrow keys.">
    <div class="cells" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div id="tiles"></div>
    <div class="message" id="message" hidden>
      <span id="message-text"></span>
      <button type="button" id="message-button"></button>
    </div>
  </div>

  <section class="photos">
    <div class="photos-head">
      <h2>Photos</h2>
      <button type="button" class="link" id="toggle-photos" aria-expanded="true" aria-controls="photos-body">Hide</button>
    </div>
    <div id="photos-body">
      <p>Upload photos assigns them in the order you pick them: the first to 2, the next to 4, and so on. Tap a square to change just that one.</p>
      <div class="slots" id="slots"></div>
      <button type="button" id="upload">Upload photos</button>
    </div>
  </section>

  <input type="file" id="file-many" class="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
  <input type="file" id="file-one" class="file" accept="image/*" tabindex="-1" aria-hidden="true">
</main>

<script>
(() => {
  'use strict';

  const SIZE = 4;
  const SLOTS = 11; // tiles 2 .. 2048
  const PHOTO_PX = 360;
  const $ = (s) => document.querySelector(s);
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  /* ---------- Photos ---------- */
  let photos = load('p2048.photos', []);
  photos = Array.from({ length: SLOTS }, (_, i) =>
    Array.isArray(photos) && typeof photos[i] === 'string' && photos[i].startsWith('data:image/') ? photos[i] : null);

  // Shrink the whole photo (no cropping) so it stays small enough to save.
  async function toPhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const scale = Math.min(1, PHOTO_PX / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.82);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function photosChanged() {
    save('p2048.photos', photos);
    renderSlots();
    renderTiles(true);
  }

  const slotsEl = $('#slots');
  const fileMany = $('#file-many'), fileOne = $('#file-one');
  let pickingSlot = -1;

  function renderSlots() {
    slotsEl.textContent = '';
    photos.forEach((src, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'slot' + (src ? ' has-photo' : '');
      b.textContent = 2 ** (i + 1);
      b.setAttribute('aria-label', `Photo for tile ${2 ** (i + 1)}`);
      if (src) b.style.backgroundImage = `url("${src}")`;
      b.addEventListener('click', () => { pickingSlot = i; fileOne.click(); });
      slotsEl.appendChild(b);
    });
  }

  const photosBody = $('#photos-body'), toggleBtn = $('#toggle-photos');
  function setPhotosVisible(show) {
    photosBody.hidden = !show;
    toggleBtn.textContent = show ? 'Hide' : 'Show';
    toggleBtn.setAttribute('aria-expanded', String(show));
    save('p2048.showPhotos', show);
  }
  toggleBtn.addEventListener('click', () => setPhotosVisible(photosBody.hidden));
  setPhotosVisible(load('p2048.showPhotos', true) !== false);

  $('#upload').addEventListener('click', () => fileMany.click());
  fileMany.addEventListener('change', async () => {
    // Assign in the order picked: first photo to 2, second to 4, and so on.
    const files = [...fileMany.files].slice(0, SLOTS);
    fileMany.value = '';
    await Promise.all(files.map(async (file, i) => {
      try { photos[i] = await toPhoto(file); } catch { return; }
      photosChanged(); // show each photo as soon as it's ready
    }));
  });
  fileOne.addEventListener('change', async () => {
    const f = fileOne.files[0];
    fileOne.value = '';
    if (!f || pickingSlot < 0) return;
    try { photos[pickingSlot] = await toPhoto(f); } catch { return; }
    photosChanged();
  });

  /* ---------- Game ---------- */
  let grid, score, won, nextId = 1;
  const emptyGrid = () => Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  const tiles = () => grid.flat().filter(Boolean);

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!grid[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = { id: nextId++, level: Math.random() < 0.9 ? 1 : 2, r, c, isNew: true };
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const t = grid[r][c];
      if (!t) return true;
      if (c + 1 < SIZE && grid[r][c + 1]?.level === t.level) return true;
      if (r + 1 < SIZE && grid[r + 1][c]?.level === t.level) return true;
    }
    return false;
  }

  // Cell positions for one row/column, starting at the edge the tiles slide toward.
  function line(dir, i) {
    return Array.from({ length: SIZE }, (_, j) => {
      const k = SIZE - 1 - j;
      return dir === 'left' ? [i, j] : dir === 'right' ? [i, k] : dir === 'up' ? [j, i] : [k, i];
    });
  }

  function move(dir) {
    if (!messageEl.hidden) return;
    const next = emptyGrid();
    const merged = [];
    let moved = false;
    for (let i = 0; i < SIZE; i++) {
      const cells = line(dir, i);
      const row = cells.map(([r, c]) => grid[r][c]).filter(Boolean);
      let k = 0;
      for (let j = 0; j < row.length; j++, k++) {
        const [r, c] = cells[k];
        const t = row[j], u = row[j + 1];
        if (u && u.level === t.level) {
          next[r][c] = { id: t.id, level: t.level + 1, r, c };
          merged.push({ id: u.id, r, c });
          score += 2 ** (t.level + 1);
          moved = true;
          j++;
        } else {
          if (t.r !== r || t.c !== c) moved = true;
          next[r][c] = { id: t.id, level: t.level, r, c };
        }
      }
    }
    if (!moved) return;
    grid = next;
    addRandomTile();
    renderTiles(false, merged);
    if (!won && tiles().some((t) => t.level >= SLOTS)) { won = true; showMessage('You win!', 'Keep going'); }
    else if (!canMove()) showMessage('Game over', 'Try again');
    persist();
  }

  function newGame() {
    grid = emptyGrid();
    score = 0;
    won = false;
    addRandomTile();
    addRandomTile();
    messageEl.hidden = true;
    renderTiles(true);
    persist();
  }

  function persist() {
    $('#score').textContent = score;
    save('p2048.game', { tiles: tiles().map((t) => [t.r, t.c, t.level]), score, won });
  }

  /* ---------- Drawing ---------- */
  const tilesEl = $('#tiles');
  const els = new Map();
  const NUMBER_COLORS = ['#eee4da', '#ede0c8', '#f2b179', '#f59563', '#f67c5f', '#f65e3b', '#edcf72', '#edcc61', '#edc850', '#edc53f', '#edc22e'];

  function paint(el, t) {
    el.style.setProperty('--r', t.r);
    el.style.setProperty('--c', t.c);
    const face = el.firstChild;
    const photo = photos[t.level - 1];
    if (photo) {
      face.style.setProperty('--tile-bg', 'var(--photo-bg)');
      face.style.backgroundImage = `url("${photo}")`;
      face.textContent = '';
    } else {
      face.style.backgroundImage = 'none';
      face.style.setProperty('--tile-bg', NUMBER_COLORS[Math.min(t.level, SLOTS) - 1]);
      face.style.setProperty('--tile-fg', t.level <= 2 ? '#776e65' : '#ffffff');
      face.textContent = 2 ** t.level;
    }
  }

  function renderTiles(rebuild, merged = []) {
    if (rebuild) { tilesEl.textContent = ''; els.clear(); }
    // A tile absorbed in a merge slides into place underneath, then disappears.
    for (const m of merged) {
      const el = els.get(m.id);
      if (!el) continue;
      els.delete(m.id);
      el.classList.add('gone');
      el.style.setProperty('--r', m.r);
      el.style.setProperty('--c', m.c);
      setTimeout(() => el.remove(), 100);
    }
    for (const t of tiles()) {
      let el = els.get(t.id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'tile' + (t.isNew ? ' new' : '');
        el.innerHTML = '<div class="tile-face"></div>';
        tilesEl.appendChild(el);
        els.set(t.id, el);
      }
      paint(el, t);
      delete t.isNew;
    }
  }

  /* ---------- Messages ---------- */
  const messageEl = $('#message');
  function showMessage(text, buttonText) {
    $('#message-text').textContent = text;
    $('#message-button').textContent = buttonText;
    messageEl.hidden = false;
  }
  $('#message-button').addEventListener('click', () => {
    if (canMove()) messageEl.hidden = true; // "Keep going" after a win
    else newGame();
  });
  $('#new-game').addEventListener('click', newGame);

  /* ---------- Controls ---------- */
  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  document.addEventListener('keydown', (e) => {
    if (!KEYS[e.key]) return;
    e.preventDefault();
    move(KEYS[e.key]);
  });

  const board = $('#board');
  let start = null;
  board.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { board.setPointerCapture(e.pointerId); } catch {}
  });
  board.addEventListener('pointerup', (e) => {
    if (!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  board.addEventListener('pointercancel', () => { start = null; });
  // Keep the page from scrolling while swiping on the board.
  board.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  /* ---------- Start ---------- */
  renderSlots();
  const saved = load('p2048.game', null);
  if (saved && Array.isArray(saved.tiles) && saved.tiles.length) {
    grid = emptyGrid();
    for (const [r, c, level] of saved.tiles) grid[r][c] = { id: nextId++, level, r, c };
    score = saved.score || 0;
    won = !!saved.won;
    persist();
    renderTiles(true);
    if (!canMove()) showMessage('Game over', 'Try again');
  } else {
    newGame();
  }
})();
</script>
</body>
</html>
